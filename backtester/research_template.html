<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Research: __TITLE__</title>
<style>
:root { color-scheme: light; --bg:#f5f5f3; --surface:#fcfcfb; --surface-2:#f0efec; --border:#e2e1dc; --text:#0b0b0b; --text-2:#52514e; --text-3:#7a7974; --grid:#e8e7e3; --axis:#b9b8b2;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --pos:#2a78d6; --neg:#e34948; --mid:#f0efec; --good:#1a7f37; --bad:#c62828; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { color-scheme: dark; --bg:#121211; --surface:#1a1a19; --surface-2:#242422; --border:#33332f; --text:#fff; --text-2:#c3c2b7; --text-3:#8f8e86; --grid:#2b2b28; --axis:#4a4a45;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --pos:#3987e5; --neg:#e66767; --mid:#383835; --good:#4cc26b; --bad:#ff7b72; } }
:root[data-theme="dark"] { color-scheme: dark; --bg:#121211; --surface:#1a1a19; --surface-2:#242422; --border:#33332f; --text:#fff; --text-2:#c3c2b7; --text-3:#8f8e86; --grid:#2b2b28; --axis:#4a4a45;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --pos:#3987e5; --neg:#e66767; --mid:#383835; --good:#4cc26b; --bad:#ff7b72; }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--text); font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
.wrap { max-width:1180px; margin:0 auto; padding:24px 16px 64px; }
h1 { font-size:20px; margin:0 0 6px; } h2 { font-size:15px; margin:0 0 12px; }
.card { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:16px; margin-top:16px; min-width:0; }
.note { color:var(--text-2); font-size:12.5px; }
table { border-collapse:collapse; width:100%; font-variant-numeric:tabular-nums; }
th, td { padding:5px 8px; text-align:right; border-bottom:1px solid var(--grid); white-space:nowrap; }
th { color:var(--text-2); font-size:12px; position:sticky; top:0; background:var(--surface); cursor:pointer; }
td:first-child, th:first-child { text-align:left; }
.scroll { overflow:auto; max-height:520px; } .xscroll { overflow-x:auto; }
.pos { color:var(--good); } .neg { color:var(--bad); }
.heat td { text-align:center; border:2px solid var(--surface); font-size:12px; }
.chart svg { display:block; width:100%; } .chart text { fill:var(--text-3); font-size:11px; }
.legend { display:flex; flex-wrap:wrap; gap:14px; font-size:12px; color:var(--text-2); margin-bottom:6px; }
.legend i { width:14px; height:2px; display:inline-block; margin-right:6px; vertical-align:middle; }
code { background:var(--surface-2); padding:2px 6px; border-radius:6px; font-size:12.5px; }
</style>
</head>
<body><div class="wrap" id="root"></div>
<script id="data" type="application/json">__DATA__</script>
<script>
(function () {
  const D = JSON.parse(document.getElementById('data').textContent);
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const col = i => css(['--s1', '--s2', '--s3', '--s4', '--s5'][i % 5]);
  const el = (t, a = {}, x) => { const e = document.createElement(t); for (const k in a) e.setAttribute(k, a[k]); if (x != null) e.textContent = x; return e; };
  const S = (t, a = {}) => { const e = document.createElementNS('http://www.w3.org/2000/svg', t); for (const k in a) e.setAttribute(k, a[k]); return e; };
  const isNum = v => typeof v === 'number' && isFinite(v);
  const pct = (v, d = 2) => isNum(v) ? (v * 100).toFixed(d) + '%' : '—';
  const num = (v, d = 2) => isNum(v) ? v.toFixed(d) : '—';
  const root = document.getElementById('root');
  const card = (title) => { const c = el('div', { class: 'card' }); if (title) c.append(el('h2', {}, title)); root.append(c); return c; };
  root.append(el('h1', {}, D.title));
  function table(parent, head, rows, sortable) {
    const wrap = el('div', { class: 'scroll' }); const t = el('table'); wrap.append(t); parent.append(wrap);
    let si = -1, asc = false;
    const draw = () => {
      t.replaceChildren(); const tr = el('tr');
      head.forEach((h, i) => { const th = el('th', {}, h + (i === si ? (asc ? ' ▲' : ' ▼') : '')); if (sortable) th.onclick = () => { asc = si === i ? !asc : false; si = i; draw(); }; tr.append(th); });
      const th = el('thead'); th.append(tr); t.append(th);
      let rs = rows.slice(); if (si >= 0) rs.sort((a, b) => { const x = a[si].v ?? a[si], y = b[si].v ?? b[si]; return (x > y ? 1 : x < y ? -1 : 0) * (asc ? 1 : -1); });
      const tb = el('tbody'); rs.forEach(r => { const tr = el('tr'); r.forEach(c => { const td = el('td', {}, c && typeof c === 'object' ? c.t : c); if (c && c.c) td.className = c.c; tr.append(td); }); tb.append(tr); }); t.append(tb);
    };
    draw();
  }
  function lines(parent, series, fmtY) {
    const box = el('div', { class: 'chart' }); parent.append(box);
    const lg = el('div', { class: 'legend' }); series.forEach(s => { const sp = el('span'); const i = el('i'); i.style.background = s.color; sp.append(i, document.createTextNode(s.name)); lg.append(sp); }); box.append(lg);
    const W = box.clientWidth || 900, H = 300, m = { l: 60, r: 10, t: 10, b: 24 }, iw = W - m.l - m.r, ih = H - m.t - m.b;
    let t0 = Infinity, t1 = -Infinity, lo = Infinity, hi = -Infinity;
    series.forEach(s => s.dates.forEach((d, i) => { const t = Date.parse(d); t0 = Math.min(t0, t); t1 = Math.max(t1, t); lo = Math.min(lo, s.values[i]); hi = Math.max(hi, s.values[i]); }));
    const log = hi / lo > 8, f = log ? Math.log : (v => v);
    const X = t => m.l + (t - t0) / (t1 - t0 || 1) * iw, Y = v => m.t + (1 - (f(v) - f(lo)) / (f(hi) - f(lo) || 1)) * ih;
    const svg = S('svg', { viewBox: `0 0 ${W} ${H}`, height: H });
    for (let k = 0; k <= 4; k++) { const v = log ? Math.exp(f(lo) + (f(hi) - f(lo)) * k / 4) : lo + (hi - lo) * k / 4; svg.append(S('line', { x1: m.l, x2: m.l + iw, y1: Y(v), y2: Y(v), stroke: css('--grid') })); const tx = S('text', { x: m.l - 6, y: Y(v) + 4, 'text-anchor': 'end' }); tx.textContent = fmtY(v); svg.append(tx); }
    const y0 = new Date(t0).getUTCFullYear(), y1 = new Date(t1).getUTCFullYear(), step = Math.max(1, Math.ceil((y1 - y0) / 10));
    for (let y = y0; y <= y1; y += step) { const tx = S('text', { x: X(Date.UTC(y, 0, 1)), y: H - 6, 'text-anchor': 'middle' }); tx.textContent = y; svg.append(tx); }
    series.forEach(s => { const step2 = Math.max(1, Math.floor(s.dates.length / 1500)); let d = ''; s.dates.forEach((dt, i) => { if (i % step2) return; d += (d ? 'L' : 'M') + X(Date.parse(dt)).toFixed(1) + ',' + Y(s.values[i]).toFixed(1); }); svg.append(S('path', { d, fill: 'none', stroke: s.color, 'stroke-width': 2 })); });
    box.append(svg);
  }
  const mix = (a, b, t) => { const p = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16)); const A = p(a), B = p(b); return `rgb(${A.map((v, i) => Math.round(v + (B[i] - v) * t)).join(',')})`; };

  if (D.kind === 'sweep') {
    root.append(el('div', { class: 'note' }, `${D.rows.length} combinations of ${D.text}, ranked by ${D.objective}.`));
    const ok = D.rows.filter(r => r.ok);
    const mt = D.multiple_testing || {};
    if (mt.n_trials >= 2 && isNum(mt.expected_max_sharpe)) {
      const c = card('Multiple testing: is the best result better than luck?');
      const sig = isNum(mt.dsr) && mt.dsr >= 0.95;
      const t = el('table'); const tb = el('tbody');
      [['Combinations tried (that traded)', `${mt.n_trials} of ${mt.n_combinations}`],
       ['Best Sharpe', `${num(mt.best_sharpe)} ${JSON.stringify(mt.best_params || [])}`],
       ['Spread (sd) of Sharpe across combinations', num(mt.sd_sharpe)],
       ['Expected best Sharpe from luck alone', `${num(mt.expected_max_sharpe)} (rough rule sd × √(2 ln N): ${num(mt.expected_max_sharpe_simple)})`],
       ['Deflated Sharpe Ratio', isNum(mt.dsr) ? { t: pct(mt.dsr, 1) + (sig ? ' — significant at 95%' : ' — not significant'), c: sig ? 'pos' : 'neg' } : '—'],
      ].forEach(([k, v]) => { const tr = el('tr'); tr.append(el('td', {}, k)); const td = el('td', {}, v && typeof v === 'object' ? v.t : v); if (v && v.c) td.className = v.c; tr.append(td); tb.append(tr); });
      t.append(tb); c.append(t);
      c.append(el('p', { class: 'note' }, 'Trying many combinations and keeping the best inflates its Sharpe. The Deflated Sharpe Ratio (Bailey & López de Prado, 2014) is the probability that the best combination\'s true Sharpe is above zero once the number of tries, the spread of results, the sample length and the skew/fat tails of its daily returns are allowed for. It treats the combinations as independent; neighbouring parameters are correlated, so the real number of independent tries is smaller.'));
    }
    if (D.labels.length === 2) {
      const c = card(`Heatmap of ${D.objective}`);
      const xs = [...new Set(ok.map(r => r.params[0]))].sort((a, b) => a - b), ys = [...new Set(ok.map(r => r.params[1]))].sort((a, b) => a - b);
      const vals = ok.map(r => r[D.objective]).filter(isNum), lo = Math.min(...vals), hi = Math.max(...vals), midv = vals.slice().sort((a, b) => a - b)[Math.floor(vals.length / 2)];
      const t = el('table', { class: 'heat' }); const hr = el('tr'); hr.append(el('th', {}, D.labels[1] + ' ↓ / ' + D.labels[0] + ' →')); xs.forEach(x => hr.append(el('th', {}, x))); t.append(hr);
      ys.forEach(y => { const tr = el('tr'); tr.append(el('td', {}, y)); xs.forEach(x => { const r = ok.find(r => r.params[0] === x && r.params[1] === y); const v = r ? r[D.objective] : null; const td = el('td', {}, isNum(v) ? (D.objective === 'cagr' || D.objective === 'total_return' ? pct(v, 1) : num(v)) : ''); if (isNum(v)) { const tt = v >= midv ? (v - midv) / (hi - midv || 1) : (midv - v) / (midv - lo || 1); td.style.background = mix(css('--mid'), v >= midv ? css('--pos') : css('--neg'), Math.min(1, tt) * 0.85); if (tt > 0.55) td.style.color = '#fff'; td.title = r.text; } tr.append(td); }); t.append(tr); });
      const w = el('div', { class: 'xscroll' }); w.append(t); c.append(w);
      c.append(el('p', { class: 'note' }, 'Look for a broad region of good results rather than a single bright cell: isolated peaks rarely survive out of sample.'));
    }
    if (D.labels.length === 1) {
      const c = card(`${D.objective} by ${D.labels[0]}`);
      lines(c, [{ name: D.objective, color: col(0), dates: ok.map((r, i) => '2000-01-' + String(1 + i).padStart(2, '0')), values: ok.map(r => r[D.objective]) }], v => v.toFixed(2));
    }
    const cv = Object.entries(D.curves);
    if (cv.length) { const c = card('Equity curves of the top combinations'); lines(c, cv.map(([k, s], i) => ({ name: k, color: col(i), dates: s.dates, values: s.values })), v => '$' + Math.round(v).toLocaleString()); }
    const c = card('All combinations');
    table(c, D.labels.concat(['CAGR', 'Sharpe', 'Sortino', 'Max DD', 'Trades', 'Win rate', 'Profit factor']),
      D.rows.map(r => r.ok ? r.params.concat([{ t: pct(r.cagr), v: r.cagr, c: r.cagr > 0 ? 'pos' : 'neg' }, { t: num(r.sharpe), v: r.sharpe }, { t: num(r.sortino), v: r.sortino }, { t: pct(r.max_drawdown, 1), v: r.max_drawdown }, r.trades, { t: pct(r.win_rate, 0), v: r.win_rate }, { t: num(r.profit_factor), v: r.profit_factor }]) : r.params.concat([{ t: 'error: ' + r.error }, '', '', '', '', '', ''])), true);
  }
  if (D.kind === 'walk') {
    root.append(el('div', { class: 'note' }, `${D.anchored ? 'Anchored' : 'Rolling'} walk-forward of ${D.text}: each window picks the parameters with the best in-sample ${D.objective} and trades them on the following, unseen period.`));
    if (D.oos) { const c = card('Stitched out-of-sample equity'); lines(c, [{ name: 'out-of-sample', color: col(0), dates: D.oos.dates, values: D.oos.values }], v => '$' + Math.round(v).toLocaleString());
      const s = D.oos_stats || {}, h = D.hindsight || {};
      c.append(el('p', { class: 'note' }, `Out of sample: CAGR ${pct(s.cagr)}, Sharpe ${num(s.sharpe)}, max drawdown ${pct(s.max_drawdown, 1)}. Hindsight-best parameters ${JSON.stringify(h.params)} over the same period: CAGR ${pct(h.cagr)}, Sharpe ${num(h.sharpe)}.`)); }
    const c = card('Windows');
    table(c, ['In-sample', 'Out-of-sample', 'Chosen parameters', 'In-sample ' + D.objective, 'OOS return', 'OOS Sharpe', 'OOS max DD'],
      D.windows.map(w => [w.in_sample.join(' → '), w.out_sample.join(' → '), JSON.stringify(w.params), num(w.is_score), { t: pct(w.oos_return), c: w.oos_return > 0 ? 'pos' : 'neg' }, num(w.oos_sharpe), pct(w.oos_max_drawdown, 1)]));
  }
  if (D.kind === 'optimize') {
    root.append(el('div', { class: 'note' }, `Monthly total returns ${D.fit_start} → ${D.fit_end}; T-bill ${pct(D.rf)}. Long-only, weights sum to 100%.`));
    const C0 = D.constraints || {};
    const lim = Object.entries(C0.bounds || {}).map(([t, [a, b]]) => (a != null ? pct(a, 0) + ' ≤ ' : '') + t + (b != null ? ' ≤ ' + pct(b, 0) : ''))
      .concat((C0.groups || []).map(g => g.text));
    if (C0.max_weight < 1 || C0.min_weight > 0) lim.unshift(`every asset ${pct(C0.min_weight, 0)}–${pct(C0.max_weight, 0)}`);
    if (lim.length) root.append(el('div', { class: 'note' }, 'Constraints: ' + lim.join('; ')));
    (D.notes || []).forEach(n => root.append(el('div', { class: 'note' }, 'Note: ' + n)));
    const P = Object.entries(D.portfolios);
    const c = card('Efficient frontier');
    c.append(el('p', { class: 'note' }, 'The line is the lowest volatility for each expected return under the constraints. Grey dots are the assets; numbered dots are the portfolios in the table below.'));
    const box = el('div', { class: 'chart' }); c.append(box);
    const W = box.clientWidth || 900, H = 360, m = { l: 56, r: 16, t: 10, b: 30 }, iw = W - m.l - m.r, ih = H - m.t - m.b;
    const pts = D.frontier.map(p => [p.vol, p.return]).concat(D.assets.map(a => [a.vol, a.return])).concat(P.map(([n, p]) => [p.exp_vol, p.exp_return]));
    const vx = pts.map(p => p[0]), vy = pts.map(p => p[1]); const x0 = 0, x1 = Math.max(...vx) * 1.1, y0 = Math.min(0, ...vy), y1 = Math.max(...vy) * 1.1;
    const X = v => m.l + (v - x0) / (x1 - x0) * iw, Y = v => m.t + (1 - (v - y0) / (y1 - y0)) * ih;
    const svg = S('svg', { viewBox: `0 0 ${W} ${H}`, height: H });
    for (let k = 0; k <= 4; k++) { const v = y0 + (y1 - y0) * k / 4; svg.append(S('line', { x1: m.l, x2: m.l + iw, y1: Y(v), y2: Y(v), stroke: css('--grid') })); const tx = S('text', { x: m.l - 6, y: Y(v) + 4, 'text-anchor': 'end' }); tx.textContent = pct(v, 0); svg.append(tx); const vv = x0 + (x1 - x0) * k / 4, tx2 = S('text', { x: X(vv), y: H - 8, 'text-anchor': 'middle' }); tx2.textContent = pct(vv, 0); svg.append(tx2); }
    const lab = S('text', { x: m.l + iw, y: m.t + ih - 6, 'text-anchor': 'end' }); lab.textContent = 'volatility →'; svg.append(lab);
    const lab2 = S('text', { x: m.l + 4, y: m.t + 10 }); lab2.textContent = '↑ expected return'; svg.append(lab2);
    if (D.frontier.length) svg.append(S('path', { d: 'M' + D.frontier.map(p => X(p.vol).toFixed(1) + ',' + Y(p.return).toFixed(1)).join('L'), fill: 'none', stroke: col(0), 'stroke-width': 2 }));
    D.assets.forEach(a => { const g = S('g'); g.append(S('circle', { cx: X(a.vol), cy: Y(a.return), r: 5, fill: css('--text-3') })); const tt = S('title'); tt.textContent = `${a.ticker}: return ${pct(a.return, 1)}, volatility ${pct(a.vol, 1)}`; g.append(tt); svg.append(g); const tx = S('text', { x: X(a.vol) + 8, y: Y(a.return) + 4 }); tx.textContent = a.ticker; svg.append(tx); });
    P.forEach(([n, p], i) => { const g = S('g'); g.append(S('circle', { cx: X(p.exp_vol), cy: Y(p.exp_return), r: 9, fill: col(1), stroke: css('--surface'), 'stroke-width': 2 })); const tx = S('text', { x: X(p.exp_vol), y: Y(p.exp_return) + 4, 'text-anchor': 'middle' }); tx.textContent = i + 1; tx.style.fill = '#fff'; tx.style.fontSize = '10px'; g.append(tx); const tt = S('title'); tt.textContent = `${i + 1}. ${n}: return ${pct(p.exp_return, 1)}, volatility ${pct(p.exp_vol, 1)}, Sharpe ${num(p.exp_sharpe)}`; g.append(tt); svg.append(g); });
    box.append(svg);
    const c2 = card('Optimised portfolios');
    const tks = D.tickers;
    table(c2, ['Portfolio', 'Exp. return', 'Exp. vol', 'Sharpe', 'Sortino', 'CVaR 95% (month)', 'Div. ratio'].concat(tks),
      P.map(([n, p], i) => [`${i + 1}. ${n}`, pct(p.exp_return), pct(p.exp_vol), num(p.exp_sharpe), num(p.exp_sortino), pct(p.cvar_95_monthly), num(p.diversification_ratio)].concat(tks.map(t => pct(p.weights[t] || 0, 1)))));
    c2.append(el('h2', { style: 'margin-top:14px' }, 'Risk contributions (share of portfolio variance)'));
    table(c2, ['Portfolio'].concat(tks), P.map(([n, p]) => [n].concat(tks.map(t => pct((p.risk_contributions || {})[t] || 0, 0)))));
    c2.append(el('h2', { style: 'margin-top:14px' }, 'Backtest one of these'));
    c2.append(el('p', { class: 'note' }, 'Weights rounded to whole percents that add up to exactly 100%. Paste a sentence into the Backtest page.'));
    P.forEach(([n, p]) => { const d = el('div', { style: 'margin:4px 0' }); d.append(el('span', { class: 'note' }, n + ': '), el('code', {}, p.sentence || '')); c2.append(d); });
    if (D.rolling) {
      const ro = D.rolling, cr = card(`Walk-forward: re-optimised every ${ro.every_months} months on the trailing ${ro.lookback_months} months`);
      cr.append(el('p', { class: 'note' }, `${ro.start} → ${ro.end}, growth of $10,000, monthly. ${ro.note}`));
      const names = Object.keys(ro.stats);
      const pick = el('select'); names.forEach(n => pick.append(el('option', { value: n }, n))); cr.append(pick);
      const holder = el('div'); cr.append(holder);
      const drawR = () => { holder.replaceChildren(); const n = pick.value; const ser = [{ name: n + ' (rolling, out of sample)', color: col(0), dates: ro.dates, values: ro.curves[n] }];
        if (ro.curves[n + ' (static)']) ser.push({ name: n + ' (static, hindsight)', color: col(1), dates: ro.dates, values: ro.curves[n + ' (static)'] });
        lines(holder, ser, v => '$' + Math.round(v).toLocaleString()); };
      pick.onchange = drawR; drawR();
      table(cr, ['Objective', 'Rolling CAGR', 'Rolling Sharpe', 'Rolling max DD', 'Static CAGR', 'Static Sharpe', 'Static max DD'],
        names.map(n => { const a = ro.stats[n].rolling || {}, b = ro.stats[n].static || {}; return [n, { t: pct(a.cagr), v: a.cagr }, { t: num(a.sharpe), v: a.sharpe }, { t: pct(a.max_drawdown, 1), v: a.max_drawdown }, { t: pct(b.cagr), v: b.cagr }, { t: num(b.sharpe), v: b.sharpe }, { t: pct(b.max_drawdown, 1), v: b.max_drawdown }]; }), true);
    }
    if (D.test && Object.keys(D.test).length) { const c3 = card(`Out-of-sample check from ${D.test_start}`); table(c3, ['Portfolio', 'CAGR', 'Volatility', 'Sharpe', 'Max DD'], Object.entries(D.test).map(([n, s]) => [n, pct(s.cagr), pct(s.volatility), num(s.sharpe), pct(s.max_drawdown, 1)])); }
    const c4 = card('Correlation of monthly returns');
    const t = el('table', { class: 'heat' }); const hr = el('tr'); hr.append(el('th', {}, '')); tks.forEach(x => hr.append(el('th', {}, x))); t.append(hr);
    D.correlation.forEach((row, i) => { const tr = el('tr'); tr.append(el('td', {}, tks[i])); row.forEach(v => { const td = el('td', {}, num(v)); td.style.background = mix(css('--mid'), v >= 0 ? css('--pos') : css('--neg'), Math.min(1, Math.abs(v)) * 0.85); if (Math.abs(v) > 0.55) td.style.color = '#fff'; tr.append(td); }); t.append(tr); });
    c4.append(t);
  }
})();
</script>
</body></html>
