name: Fetch price data

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/fetch_data.py
      - .github/workflows/fetch-data.yml
      - data/extra_tickers.txt
      - data/requested_tickers.txt   # the request queue: downloaded first (backtester/coverage.py)
      - data/mutual_funds.txt
      - backtester/fund_lists.py
      - backtester/coverage.py
  schedule:
    - cron: "17 22 * * 1-5"   # weekdays after the US close

permissions:
  contents: write

concurrency:
  group: fetch-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 240   # the rotating batches stop after ROTATION_DEADLINE_MIN (scripts/fetch_data.py)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install yfinance pandas requests lxml openpyxl xlrd
      - run: python scripts/fetch_data.py
        env:
          # optional: free keys let the job fill in delisted former Nasdaq-100 members (see README)
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
          STOOQ_API_KEY: ${{ secrets.STOOQ_API_KEY }}
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "data: refresh daily prices ($(date -u +%F))"
          git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" || { git rebase --abort; git pull --no-rebase -X ours --no-edit origin "${GITHUB_REF_NAME}"; }
          git push origin "HEAD:${GITHUB_REF_NAME}"
